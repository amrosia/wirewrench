[package]
name = "wirewrench"
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities"]
description = "A remote shell toolkit — catch reverse shells, interact with web shells, manage sessions"
repository = "https://github.com/amrosia/wirewrench"

[[bin]]
name = "ww"
path = "src/bin/client.rs"

[[bin]]
name = "ww-server"
path = "src/bin/server.rs"

[[bin]]
name = "ww-target"
path = "src/bin/target.rs"

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
termios = "0.3"
anyhow = "1"
ctrlc = "3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rustyline = "15"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
url = { version = "2", optional = true }

[features]
default = ["web"]
web = ["dep:reqwest", "dep:url"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
