[package]
name = "wirewrench"
version = "3.2.0"
edition = "2024"
autobins = false
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities"]
description = "A remote shell toolkit — catch reverse shells and manage sessions"
repository = "https://github.com/amrosia/wirewrench"

[[bin]]
name = "ww"
path = "src/bin/client.rs"

[[bin]]
name = "ww-server"
path = "src/bin/server/main.rs"

[[bin]]
name = "ww-target"
path = "src/bin/target.rs"

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rustyline = "15"
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
rand = "0.10.2"
base64ct = "1.8.3"
rpassword = "7.5.4"
signature = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
