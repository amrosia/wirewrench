name: Release

# Builds release binaries for every version tag (e.g. v3.1.0) and publishes
# them as a GitHub Release.
#
# To cut a release:
#   git tag v3.1.0 && git push origin v3.1.0
#
# Artifacts (naming: <binary>-<arch>-<os>):
#   ww-amd64-linux            (static musl)
#   ww-server-amd64-linux     (static musl)
#   ww-target-amd64-linux     (static musl)
#   ww-target-amd64-windows.exe
#   ww-target-arm64-macos
#   ww-target-amd64-macos
#
# ww / ww-server are Unix-only by design (see src/bin); ww-target is the
# cross-platform agent, hence the Windows and macOS builds.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: ww / ww-server / ww-target (amd64 linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Stage release binaries
        run: |
          mkdir -p staging
          cp target/x86_64-unknown-linux-musl/release/ww        staging/ww-amd64-linux
          cp target/x86_64-unknown-linux-musl/release/ww-server staging/ww-server-amd64-linux
          cp target/x86_64-unknown-linux-musl/release/ww-target staging/ww-target-amd64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: staging/

  build-windows:
    name: ww-target (amd64 windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo build --release --target x86_64-pc-windows-gnu --bin ww-target
      - name: Stage release binary
        run: |
          mkdir -p staging
          cp target/x86_64-pc-windows-gnu/release/ww-target.exe staging/ww-target-amd64-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/

  build-macos:
    name: ww-target (arm64 + amd64 macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin --bin ww-target
      - run: cargo build --release --target x86_64-apple-darwin --bin ww-target
      - name: Stage release binaries
        run: |
          mkdir -p staging
          cp target/aarch64-apple-darwin/release/ww-target staging/ww-target-arm64-macos
          cp target/x86_64-apple-darwin/release/ww-target  staging/ww-target-amd64-macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: staging/

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
